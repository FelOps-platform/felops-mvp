services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: felops
      POSTGRES_PASSWORD: felops
      POSTGRES_DB: felops
    ports: ['5433:5432']
    volumes:
      - felops_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U felops -d felops']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ['9000:9000', '9001:9001']
    volumes:
      - felops_minio:/data

volumes:
  felops_pg:
  felops_minio:
