# Railway deployment.
#
# Create three services from this repository:
#   1. web      → Dockerfile: apps/web/Dockerfile     (public, port 3000)
#   2. worker   → Dockerfile: apps/worker/Dockerfile  (no public networking)
#   3. postgres → Neon Postgres 16 + pgvector (or Railway Postgres with the vector extension)
#
# Add a Railway Redis service for queues and rate limits, and an S3-compatible bucket
# (Railway MinIO template or Cloudflare R2) for uploads.
#
# Required variables on both web and worker:
#   DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL, APP_URL,
#   OPENAI_API_KEY, CHAT_MODEL, S3_ENDPOINT, S3_REGION, S3_BUCKET,
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, ENCRYPTION_KEY
# Optional: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, RESEND_API_KEY, RESEND_FROM

[build]
builder = 'DOCKERFILE'
dockerfilePath = 'apps/web/Dockerfile'

[deploy]
healthcheckPath = '/api/health'
healthcheckTimeout = 30
restartPolicyType = 'ON_FAILURE'
restartPolicyMaxRetries = 5
